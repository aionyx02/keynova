[hotkeys]
app_launcher    = "Ctrl+K"
mouse_control   = "Ctrl+Alt+M"
workspace_1     = "Ctrl+Alt+1"
workspace_2     = "Ctrl+Alt+2"
workspace_3     = "Ctrl+Alt+3"
workspace_cycle = "Ctrl+Alt+0"        # Cycles to the next workspace and clears the query

[launcher]
scan_paths = []          # Extra app scan paths; leave empty for platform defaults
max_results = 10
cache_ttl_secs = 300     # App cache TTL in seconds
auto_start_on_login = true

[search]
backend = "auto"
index_dir = ""
exclude_dirs = "AppData,node_modules,.git,target,dist"
max_file_results = 50
preview_enabled = true        # Show the right-side preview pane for selected files, folders, and notes
show_rank_breakdown = true    # Show rank details on result hover

[terminal]
default_shell = ""       # Empty means use the platform default shell
font_size = 14
scrollback_lines = 1000

[mouse_control]
step_size = 10           # Cursor movement step in pixels
fast_step_size = 50      # Cursor movement step while Shift is held

[features]
ai = false
translation = true
notes = true
history = true
calculator = true
system = true

[ai]
provider = "ollama"
api_key = ""
model = "qwen2.5:7b"
claude_model = "claude-sonnet-4-6"
ollama_url = "http://localhost:11434"
ollama_timeout_secs = 120
ollama_keep_alive = "5m"     # Ollama model keep-alive duration; set to "0s" to unload immediately
openai_api_key = ""
openai_base_url = "https://api.openai.com/v1"
openai_model = "gpt-4o-mini"
max_tokens = 4096
timeout_secs = 30
stream_enabled = true        # true: emit ai.stream.chunk events for token streaming UI; false: legacy single-shot

[translation]
default_src = "auto"
default_dst = "zh-TW"
provider = "google_cloud_v2"
api_key = ""
timeout_secs = 30

[security]
network_allowlist = "api.anthropic.com,api.openai.com,translation.googleapis.com,translate.googleapis.com,api.tavily.com,duckduckgo.com,github.com"

[notes]
storage_dir = ""         # Empty means AppData/Keynova/notes
default_extension = "md"
lazyvim_command = ""     # Empty means find nvim on PATH
lazyvim_config_dir = ""  # Empty means project-local .keynova/lazyvim/config/keynova-lazyvim

[history]
max_items = 200
ignore_duplicates = true

[system]
enable_volume_control = true
enable_brightness_control = true
enable_wifi_info = true

[performance]
low_memory_mode = false      # true: skip terminal prewarm and disk-walk index rebuilds, shorten keep_alive

[agent.local_context]
enabled = false              # Must be true to allow learning material review scans
max_scan_files = 500         # Maximum filesystem entries examined per scan
max_preview_bytes = 4096     # Byte cap for per-file content previews
max_depth = 4                # Maximum directory recursion depth
extra_denylist = ""          # Comma-separated extra denylist patterns (merged with built-in defaults)
