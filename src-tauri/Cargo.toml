[package]
name = "tauri-app"
version = "0.7.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables `#[ignore]`-gated integration tests that hit a live Ollama daemon
# (qwen2.5:1.5b reference default; override via KEYNOVA_LIVE_AI_MODEL).
# Default-off so CI and unit-test runs do not depend on external services.
# Run locally with:
#   cargo test --features live-ai -- --ignored ai_capability_live
live-ai = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
thiserror = "1"
anyhow = "1"
fuzzy-matcher = "0.3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
notify = "6"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.26.1"
dirs = "5"
sysinfo = "0.30"
trash = "5"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
regex = "1"
cron = "0.12"
urlencoding = "2"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Base keyring with no credential-store backend. Each OS pulls its native store
# via the target tables below; without a backend keyring 3.x silently uses a
# non-persistent in-memory mock store, so stored secrets never round-trip.
keyring = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# In-app updates (PRODUCT.3). Dormant until `plugins.updater` (endpoints+pubkey)
# is configured and updater artifacts are signed in CI — see ADR-0050.
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Native shell-icon extraction PNG encoder (ADR-0056). Windows-only: icon.rs is
# the sole consumer and the whole module is cfg(windows).
png = "0.17"
webview2-com = "0.39.1"
windows-core-compat = { package = "windows-core", version = "0.61.2" }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_JobObjects",
  "Win32_Security",
] }

# Release footprint pass. There was no release profile, so release used cargo
# defaults (no LTO, codegen-units = 16, symbols kept), inflating the binary and
# its mapped image. These are runtime-quality-neutral because they shrink the
# binary and improve codegen; only release build time grows. Intentionally not
# using opt-level = "z" or panic = "abort" because those change runtime tradeoffs.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
