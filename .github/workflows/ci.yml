name: ci

# Per-push clippy + tests on all three desktop OSes. Before this, Linux/macOS
# were only ever compiled at release-tag time (release.yml), so platform
# regressions in cfg(not(windows)) / cfg(target_os = "macos") code only surfaced
# during a release. This job catches them on every push instead.

# Triggered on the integration branches plus every PR into them, rather than on
# every push anywhere. Feature-branch pushes used to fire a full 3-OS matrix
# before a PR even existed, and a push-triggered run is a fragile thing to make
# a required status check: `concurrency.cancel-in-progress` can cancel it out
# from under an open PR, which then waits forever for a check that will not
# arrive. The pull_request trigger reports against the PR head directly.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-22.04", "macos-latest", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # No toolchain action: rust-toolchain.toml pins the version and its
      # components, and rustup installs it on the first cargo call. Naming a
      # toolchain here would be a second source for the version number, which is
      # the drift this pin exists to remove.

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      # tauri-build's build script validates frontendDist (../dist), so the
      # frontend bundle must exist before cargo clippy / test can compile.
      - name: Build frontend (creates ../dist for tauri-build)
        run: npm run build

      - name: Clippy (-D warnings)
        run: npm run rust:clippy

      - name: Rust tests
        run: npm run rust:test

  # The frontend suite (36 files, 218 cases) and eslint previously ran only
  # inside `npm run verify`, which is wired to release.yml and therefore fires
  # on version tags only. Every PR and every push to main/dev merged without
  # either one ever executing. Linux-only: these checks are platform-agnostic,
  # and the 3-OS matrix above already covers the platform-specific surface.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint (--max-warnings 0)
        run: npm run lint

      - name: Frontend tests (vitest)
        run: npm run test
