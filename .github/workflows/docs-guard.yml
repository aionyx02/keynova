name: Docs Guard

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:guard-size
      - run: npm run docs:guard-schema
      - run: npm run docs:audit-frontmatter
      - run: npm run docs:narrative-check
      - run: npm run docs:guard
